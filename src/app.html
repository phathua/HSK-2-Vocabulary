      (function() {
        try {
          var mode = localStorage.getItem('HSK_THEME_MODE') || localStorage.getItem('HSK_THEME') || 'system';
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>

    <script>
      // Đăng ký Service Worker hỗ trợ offline F5 mượt mà
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }

      // iOS standalone PWA start URL fix
      if (window.navigator.standalone && window.location.pathname === '/') {
        const urlParams = new URLSearchParams(window.location.search);
        if (!urlParams.has('pwa')) {
          window.location.href = '/?pwa=true';
        }
      }
    </script>
