    <text x="88" y="28" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Cấu trúc nhấn mạnh 是...的</text>
    <text x="170" y="28" fill="#1E40AF" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Hành động ĐÃ XẢY RA, nhấn mạnh chi tiết</text>
    <rect x="16" y="46" width="492" height="66" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
