<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <linearGradient id="g1-a" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#EFF6FF"/><stop offset="100%" stop-color="#DBEAFE"/></linearGradient>
    <linearGradient id="g1-b" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FEF3C7"/><stop offset="100%" stop-color="#FDE68A"/></linearGradient>
    <filter id="s1" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.05"/></filter>
  </defs>
  <!-- Card A: 有 (Tồn tại khách quan) -->
  <g transform="translate(8, 10)">
    <rect width="256" height="160" rx="16" fill="url(#g1-a)" stroke="#BFDBFE" stroke-width="1.5" filter="url(#s1)"/>
    <rect x="12" y="12" width="74" height="24" rx="8" fill="#2563EB"/>
    <text x="49" y="28" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">有 (yǒu)</text>
    <text x="96" y="28" fill="#1E40AF" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Tồn tại khách quan</text>
    <rect x="12" y="46" width="232" height="66" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
    <rect x="18" y="54" width="66" height="50" rx="8" fill="#F1F5F9"/>
    <text x="51" y="76" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">桌子上</text>
    <text x="51" y="92" fill="#64748B" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">trên bàn</text>
    <path d="M92 79 L108 79" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <path d="M104 75 L109 79 L104 83" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="116" y="54" width="120" height="50" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="176" y="75" fill="#1D4ED8" font-size="13" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">有一个手机</text>
    <text x="176" y="91" fill="#3B82F6" font-size="9.5" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">có một điện thoại</text>
    <text x="128" y="132" fill="#1E3A8A" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Vị trí + 有 + Danh từ</text>
    <text x="128" y="148" fill="#3B82F6" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Nhấn mạnh sự hiện hữu</text>
  </g>
  <!-- Card B: 是 (Xác định danh tính) -->
  <g transform="translate(276, 10)">
    <rect width="256" height="160" rx="16" fill="url(#g1-b)" stroke="#FDE68A" stroke-width="1.5" filter="url(#s1)"/>
    <rect x="12" y="12" width="74" height="24" rx="8" fill="#D97706"/>
    <text x="49" y="28" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">是 (shì)</text>
    <text x="96" y="28" fill="#92400E" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Xác định đích danh</text>
    <rect x="12" y="46" width="232" height="66" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/>
    <rect x="18" y="54" width="66" height="50" rx="8" fill="#F1F5F9"/>
    <text x="51" y="76" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">门外</text>
    <text x="51" y="92" fill="#64748B" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">ngoài cửa</text>
    <path d="M92 79 L108 79" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <path d="M104 75 L109 79 L104 83" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="116" y="54" width="120" height="50" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="176" y="75" fill="#B45309" font-size="12" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">是他的自行车</text>
    <text x="176" y="91" fill="#D97706" font-size="9.5" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">là xe của anh ấy</text>
    <text x="128" y="132" fill="#78350F" font-size="10.5" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Vị trí + 是 + Vật cụ thể</text>
    <text x="128" y="148" fill="#B45309" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Nhấn mạnh quyền sở hữu / danh tính</text>
  </g>
</svg>