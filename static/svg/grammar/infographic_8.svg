<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs><linearGradient id="g8" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FEF2F2"/><stop offset="100%" stop-color="#FEE2E2"/></linearGradient></defs>
  <g transform="translate(8, 10)">
    <rect width="524" height="160" rx="16" fill="url(#g8)" stroke="#FECACA" stroke-width="1.5"/>
    <rect x="16" y="12" width="130" height="24" rx="8" fill="#DC2626"/>
    <text x="81" y="28" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Phân biệt 再 (zài) &amp; 又 (yòu)</text>
    <text x="156" y="28" fill="#991B1B" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Lặp lại trong Tương lai vs Đã xảy ra trong Quá khứ</text>
    <rect x="16" y="46" width="492" height="66" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1"/>
    <g transform="translate(26, 54)">
      <rect width="220" height="50" rx="8" fill="#FEF2F2" stroke="#F87171" stroke-width="1.5"/>
      <text x="110" y="23" fill="#B91C1C" font-size="12" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">再 (zài) - Tương lai</text>
      <text x="110" y="40" fill="#DC2626" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">明天再来 / 请再说一遍 (Lại nữa / Lần nữa)</text>
    </g>
    <g transform="translate(266, 54)">
      <rect width="230" height="50" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
      <text x="115" y="23" fill="#4B5563" font-size="12" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">又 (yòu) - Quá khứ (Đã rồi)</text>
      <text x="115" y="40" fill="#6B7280" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">他又来了 (Hắn lại đến rồi - thực tế đã đến)</text>
    </g>
    <text x="262" y="132" fill="#991B1B" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Công thức HSK 2: 再 + Động từ (Hẹn gặp lại: 再见)</text>
    <text x="262" y="148" fill="#DC2626" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Mang tính kế hoạch hoặc lời đề nghị lặp lại hành động</text>
  </g>
</svg>