<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs><linearGradient id="g7" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFF7ED"/><stop offset="100%" stop-color="#FFEDD5"/></linearGradient></defs>
  <g transform="translate(8, 10)">
    <rect width="524" height="160" rx="16" fill="url(#g7)" stroke="#FED7AA" stroke-width="1.5"/>
    <rect x="16" y="12" width="130" height="24" rx="8" fill="#EA580C"/>
    <text x="81" y="28" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Phó từ 就 (jiù) Liền / Ngay</text>
    <text x="156" y="28" fill="#9A3412" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Biểu thị sự việc xảy ra sớm, nhanh, thuận lợi</text>
    <rect x="16" y="46" width="492" height="66" rx="10" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1"/>
    <g transform="translate(26, 54)">
      <rect width="220" height="50" rx="8" fill="#FFF7ED" stroke="#FB923C"/>
      <text x="110" y="23" fill="#C2410C" font-size="11.5" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Sự việc xảy ra sớm / nhanh</text>
      <text x="110" y="39" fill="#EA580C" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">我七点就到了 (7h tôi đã đến rồi)</text>
    </g>
    <g transform="translate(266, 54)">
      <rect width="230" height="50" rx="8" fill="#EFF6FF" stroke="#60A5FA"/>
      <text x="115" y="23" fill="#1D4ED8" font-size="11.5" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Khẳng định dứt khoát / Ngay chính là</text>
      <text x="115" y="39" fill="#2563EB" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">他就是我们的老师 (Anh ấy chính là thầy ta)</text>
    </g>
    <text x="262" y="132" fill="#9A3412" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Vị trí: Luôn đứng TRƯỚC động từ / tính từ</text>
    <text x="262" y="148" fill="#EA580C" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Tương phản với 才 (cái gì trễ, chậm, vất vả)</text>
  </g>
</svg>