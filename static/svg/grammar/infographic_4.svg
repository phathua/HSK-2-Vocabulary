<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs><linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFBEB"/><stop offset="100%" stop-color="#FEF3C7"/></linearGradient></defs>
  <g transform="translate(8, 10)">
    <rect width="524" height="160" rx="16" fill="url(#g4)" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="16" y="12" width="125" height="24" rx="8" fill="#D97706"/>
    <text x="78" y="28" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">多 + Tính từ (Hỏi độ lớn)</text>
    <text x="152" y="28" fill="#92400E" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Hỏi mức độ, kích thước, khoảng cách</text>
    <rect x="16" y="46" width="492" height="66" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/>
    <g transform="translate(26, 54)">
      <rect width="145" height="50" rx="8" fill="#FFFBEB" stroke="#F59E0B"/>
      <text x="72" y="25" fill="#B45309" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">多大？(duō dà)</text>
      <text x="72" y="41" fill="#D97706" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Bao nhiêu tuổi / Lớn cỡ nào?</text>
    </g>
    <g transform="translate(186, 54)">
      <rect width="145" height="50" rx="8" fill="#EFF6FF" stroke="#3B82F6"/>
      <text x="72" y="25" fill="#1D4ED8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">多高？(duō gāo)</text>
      <text x="72" y="41" fill="#2563EB" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Cao bao nhiêu mét / cm?</text>
    </g>
    <g transform="translate(346, 54)">
      <rect width="150" height="50" rx="8" fill="#ECFDF5" stroke="#10B981"/>
      <text x="75" y="25" fill="#047857" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">多远？(duō yuǎn)</text>
      <text x="75" y="41" fill="#059669" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Cách xa bao nhiêu cây số?</text>
    </g>
    <text x="262" y="132" fill="#78350F" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Công thức: Chủ ngữ + 多 + Tính từ (大/高/远/长)?</text>
    <text x="262" y="148" fill="#B45309" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Trả lời trực tiếp bằng số lượng + đơn vị đo (ví dụ: 二十岁 / 一米八)</text>
  </g>
</svg>