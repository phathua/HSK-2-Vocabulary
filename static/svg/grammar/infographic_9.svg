    <g transform="translate(186, 54)">
      <rect width="145" height="50" rx="8" fill="#EFF6FF" stroke="#3B82F6"/>
      <text x="72" y="23" fill="#1D4ED8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">就要……了</text>
      <text x="72" y="40" fill="#2563EB" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Có mốc thời gian cụ thể</text>
