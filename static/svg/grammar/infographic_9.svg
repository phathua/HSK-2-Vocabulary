    <text x="262" y="132" fill="#78350F" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Chú ý bẫy thi: Nếu có trạng ngữ thời gian cụ thể (như 8点), CHỈ DÙNG 就要...了</text>
    <text x="262" y="148" fill="#B45309" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Ví dụ đúng: 明天我就要走了 (Tuyệt đối không dùng 明天我快要走了)</text>
