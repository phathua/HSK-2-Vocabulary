    <rect x="16" y="12" width="145" height="24" rx="8" fill="#D97706"/>
    <text x="88" y="28" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Trạng thái sắp xảy ra</text>
    <text x="170" y="28" fill="#92400E" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Sắp sửa... rồi (Sắp xảy ra trong chớp mắt)</text>
    <rect x="16" y="46" width="492" height="66" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/>
    <g transform="translate(26, 54)">
