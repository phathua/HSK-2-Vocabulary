      <text x="72" y="23" fill="#B45309" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">快要……了</text>
      <text x="72" y="40" fill="#D97706" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">快要下雨了 (sắp mưa rồi)</text>
