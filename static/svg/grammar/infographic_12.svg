<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs><linearGradient id="g12" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F5F3FF"/><stop offset="100%" stop-color="#EDE9FE"/></linearGradient></defs>
  <g transform="translate(8, 10)">
    <rect width="524" height="160" rx="16" fill="url(#g12)" stroke="#DDD6FE" stroke-width="1.5"/>
    <rect x="16" y="12" width="145" height="24" rx="8" fill="#7C3AED"/>
    <text x="88" y="28" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Trợ từ trải nghiệm 过 (guo)</text>
    <text x="170" y="28" fill="#5B21B6" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Đã từng trải qua trong quá khứ</text>
    <rect x="16" y="46" width="492" height="66" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1"/>
    <g transform="translate(26, 54)">
      <rect width="220" height="50" rx="8" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="110" y="23" fill="#6D28D9" font-size="12" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">Khẳng định: V + 过</text>
      <text x="110" y="40" fill="#7C3AED" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">我去过中国 (Tôi từng đi Trung Quốc)</text>
    </g>
    <g transform="translate(266, 54)">
      <rect width="230" height="50" rx="8" fill="#FEF2F2" stroke="#F87171" stroke-width="1.5"/>
      <text x="115" y="23" fill="#B91C1C" font-size="12" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">Phủ định: 没 + V + 过</text>
      <text x="115" y="40" fill="#DC2626" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">我没吃过烤鸭 (Chưa từng ăn vịt quay)</text>
    </g>
    <text x="262" y="132" fill="#5B21B6" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Khác với 了: 过 nhấn mạnh kinh nghiệm / trải nghiệm cá nhân</text>
    <text x="262" y="148" fill="#7C3AED" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Câu hỏi: 你去过中国吗？ hoặc 你去过中国没有？</text>
  </g>
</svg>