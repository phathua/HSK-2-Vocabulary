<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs><linearGradient id="g16" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ECFDF5"/><stop offset="100%" stop-color="#D1FAE5"/></linearGradient></defs>
  <g transform="translate(8, 10)">
    <rect width="524" height="160" rx="16" fill="url(#g16)" stroke="#A7F3D0" stroke-width="1.5"/>
    <rect x="16" y="12" width="145" height="24" rx="8" fill="#059669"/>
    <text x="88" y="28" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Trợ từ duy trì trạng thái 着</text>
    <text x="170" y="28" fill="#065F46" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Động tác hoặc trạng thái đang tiếp diễn, giữ nguyên</text>
    <rect x="16" y="46" width="492" height="66" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/>
    <g transform="translate(26, 54)">
      <rect width="220" height="50" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <text x="110" y="23" fill="#047857" font-size="12" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">1. Trạng thái tĩnh (Tồn tại)</text>
      <text x="110" y="40" fill="#059669" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">门开着 / 墙上挂着画 (Cửa đang mở)</text>
    </g>
    <g transform="translate(266, 54)">
      <rect width="230" height="50" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="115" y="23" fill="#1D4ED8" font-size="12" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">2. V1 + 着 + V2 (Đồng thời)</text>
      <text x="115" y="40" fill="#2563EB" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">笑着说 / 站着等 (Cười nói / Đứng đợi)</text>
    </g>
    <text x="262" y="132" fill="#065F46" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Khác với 在/正在: 着 nhấn mạnh tư thế / trạng thái TĨNH kéo dài</text>
    <text x="262" y="148" fill="#059669" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Phủ định: 没 + V + 着 (Ví dụ: 门没开着 = Cửa không có mở)</text>
  </g>
</svg>