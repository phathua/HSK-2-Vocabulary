    <text x="81" y="28" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Giới từ 离 (lí) Cách</text>
    <text x="156" y="28" fill="#166534" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Đo khoảng cách không gian hoặc thời gian</text>
    <rect x="16" y="46" width="492" height="66" rx="10" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
