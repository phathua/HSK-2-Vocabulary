<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs><linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ECFEFF"/><stop offset="100%" stop-color="#CFFAFE"/></linearGradient></defs>
  <g transform="translate(8, 10)">
    <rect width="524" height="160" rx="16" fill="url(#g5)" stroke="#A5F3FC" stroke-width="1.5"/>
    <rect x="16" y="12" width="136" height="24" rx="8" fill="#0891B2"/>
    <text x="84" y="28" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Hành động đang tiếp diễn</text>
    <text x="162" y="28" fill="#155E75" font-size="11" font-weight="700" font-family="system-ui, sans-serif">4 biến thể linh hoạt của 正在 / 在... 呢</text>
    <rect x="16" y="46" width="492" height="66" rx="10" fill="#FFFFFF" stroke="#67E8F9" stroke-width="1"/>
    <g transform="translate(24, 54)">
      <rect width="110" height="50" rx="8" fill="#ECFEFF" stroke="#06B6D4"/>
      <text x="55" y="24" fill="#0E7490" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. 正在 + V + 呢</text>
      <text x="55" y="40" fill="#0891B2" font-size="8.5" text-anchor="middle" font-family="system-ui, sans-serif">正在看书呢</text>
    </g>
    <g transform="translate(144, 54)">
      <rect width="110" height="50" rx="8" fill="#F0FDFA" stroke="#14B8A6"/>
      <text x="55" y="24" fill="#0F766E" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. 正 + V + 呢</text>
      <text x="55" y="40" fill="#0D9488" font-size="8.5" text-anchor="middle" font-family="system-ui, sans-serif">正看书呢</text>
    </g>
    <g transform="translate(264, 54)">
      <rect width="110" height="50" rx="8" fill="#EFF6FF" stroke="#3B82F6"/>
      <text x="55" y="24" fill="#1D4ED8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">3. 在 + V</text>
      <text x="55" y="40" fill="#2563EB" font-size="8.5" text-anchor="middle" font-family="system-ui, sans-serif">在看书</text>
    </g>
    <g transform="translate(384, 54)">
      <rect width="114" height="50" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
      <text x="57" y="24" fill="#B45309" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">4. V + 呢</text>
      <text x="57" y="40" fill="#D97706" font-size="8.5" text-anchor="middle" font-family="system-ui, sans-serif">看书呢</text>
    </g>
    <text x="262" y="132" fill="#155E75" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Phủ định: 没 (在) + V (Tuyệt đối KHÔNG dùng 不正在)</text>
    <text x="262" y="148" fill="#0891B2" font-size="9.5" text-anchor="middle" font-family="system-ui, sans-serif">Ví dụ: 他没看书 (Anh ấy không đang đọc sách)</text>
  </g>
</svg>