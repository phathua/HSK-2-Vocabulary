    <text x="170" y="28" fill="#1E40AF" font-size="11" font-weight="700" font-family="system-ui, sans-serif">Tân ngữ câu 1 làm Chủ ngữ câu 2</text>
    <rect x="16" y="46" width="492" height="66" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
